# Uptimer 1.5.0 — server split into services + two local workers.
# 1.5.0 is not released yet: these pull :edge (the current pre-release build).
# Swap :edge for :1.5.0 once the release ships.
# The server (ui/grpc/availabilities) shares one identity via ./data/server.
# See README.md for the one-time worker init + registration.
services:
  uptimer-ui:
    image: ghcr.io/myuptime-info/uptimer:edge
    command: ["server", "--services", "api,ui"]
    ports:
      - "2517:2517"
    volumes:
      - ./data/server:/data

  uptimer-grpc:
    image: ghcr.io/myuptime-info/uptimer:edge
    command: ["server", "--services", "grpc"]
    environment:
      UPTIMER__GRPC__PORT: "50051"
    volumes:
      - ./data/server:/data

  uptimer-availabilities:
    image: ghcr.io/myuptime-info/uptimer:edge
    command: ["server", "--services", "availabilities"]
    environment:
      # This is the service that sends alerts, and every alert links back to the rule.
      # Without a base URL to build that link from, no alert is sent — so set it here, on
      # the alerting process, not only on the one serving the UI.
      UPTIMER__GENERAL__SITE_URL: "http://localhost:2517"
    volumes:
      - ./data/server:/data

  worker1:
    image: ghcr.io/myuptime-info/uptimer:edge
    command: ["worker"]
    environment:
      UPTIMER__WORKER__GRPC_SERVER: "uptimer-grpc:50051"
      UPTIMER__WORKER__GRPC_USE_TLS: "false"
    volumes:
      - ./data/worker1:/data
    depends_on:
      - uptimer-grpc

  worker2:
    image: ghcr.io/myuptime-info/uptimer:edge
    command: ["worker"]
    environment:
      UPTIMER__WORKER__GRPC_SERVER: "uptimer-grpc:50051"
      UPTIMER__WORKER__GRPC_USE_TLS: "false"
    volumes:
      - ./data/worker2:/data
    depends_on:
      - uptimer-grpc
