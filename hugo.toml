baseURL = 'https://uptimer.myuptime.info/'
defaultContentLanguage = 'en'
title = 'Uptimer'

# No external theme — the B2 docs design lives in ./layouts + ./assets
# (ADR-0001 direction, ADR-0002 Pico.css classless + shared tokens.css).

# Taxonomy/term pages are unused on the docs site.
disableKinds = ['taxonomy', 'term']

# Versioned docs. Newest first. `latest` drives the version pill, the outdated
# banner and the /latest/ redirects (#24/#25).
[params.versions]
default = "1.7.0"
available = ["1.7.0", "1.6.0", "1.5.0", "1.4.0", "1.3.0", "1.0.0"]
latest = "1.7.0"
# No preview version right now. While a version is documented but unreleased,
# set `preview = "X.Y.Z"`: that keeps `default` and `latest` on the shipped one,
# leaves /latest/ alone, makes `{{< image >}}` emit :edge in that tree and shows
# its preview banner. At final ship (VERSIONING.md) set default+latest, repoint
# /latest/* and the root redirect, swap the examples' :edge images for :X.Y.Z,
# and clear this.

# Home also emits index.json — the client-side search index (see layouts/index.json).
[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.goldmark.renderer]
# Allow the occasional inline HTML block (status pills, cards) in content.
unsafe = true
[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false
[markup.highlight]
style = "github-dark"
noClasses = true
tabWidth = 2
